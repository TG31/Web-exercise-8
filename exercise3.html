<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="dark">Switch to dark</button>
    <script>
      let col = document.getElementById("dark");
      let index = 0;
      col.addEventListener("click", () => {
        if (index == 0) {
          document.body.style.backgroundColor = "black";
          col.textContent = "Switch to light";
          index = 1;
        } else {
          document.body.style.backgroundColor = "white";
          col.textContent = "Switch to dark";
          index = 0;
        }
      });
    </script>
  </body>
</html>
